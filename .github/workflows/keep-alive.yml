# Keeps the free Render instance of the live demo awake: it sleeps after 15 minutes
# without requests. /health returns "ok" without touching the database; no secrets needed.
# GitHub may delay scheduled runs, and disables scheduled workflows after 60 days
# without repository activity (re-enable under Actions → Keep alive).
name: Keep alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health (long timeout covers a cold start)
        run: curl -fsS --max-time 90 --retry 2 https://agrigemma.onrender.com/health
