<!-- Notification System UI Component -->
<style>

  /* ── Badge ────────────────────────────────────────────────────────────── */

    font-weight: 700;

<div id="notification-container" style="position: relative; display: inline-flex;">
  <button id="notificationBellBtn" aria-label="Notifications" title="Notifications">
    <span class="material-symbols-outlined notification-bell-icon" id="notificationBellIcon">notifications</span>
    <span class="notification-badge" id="notificationBadge"></span>
  </button>

  <!-- ── Dropdown ──────────────────────────────────────────────────────── -->
  <div class="notification-dropdown" id="notificationDropdown">
    <div class="notif-dropdown-header">
      <span class="notif-dropdown-title">Notifications</span>
      <button class="notif-mark-all-btn" id="markAllReadBtn">Mark all read</button>
    </div>
    <div class="notif-dropdown-body" id="notificationList">
      <div class="notif-empty">
        <span class="material-symbols-outlined">notifications_off</span>
        No notifications
      </div>
    </div>

    </div>

<div class="notif-modal-overlay" id="notifModalOverlay">
  <div class="notif-modal">
    <div class="notif-modal-header">
      <div class="notif-modal-header-left">
        <span class="notif-modal-icon" id="notifModalIcon"></span>
        <h2 class="notif-modal-title" id="notifModalTitle"></h2>

<script>
(function () {
  if (window.__notifSystemLoaded) return;
  window.__notifSystemLoaded = true;

  const USER_ID = 1;

  const TYPE_META = {
    info:           { icon: 'ℹ️',  cssClass: 'notif-type-info',           clickable: false },
    warning:        { icon: '⚠️',  cssClass: 'notif-type-warning',        clickable: true  },
    critical:       { icon: '🚨',  cssClass: 'notif-type-critical',       clickable: true  },
    recommendation: { icon: '💡',  cssClass: 'notif-type-recommendation', clickable: true  },
    change:         { icon: '🔄',  cssClass: 'notif-type-change',         clickable: true  },
  };

  let notifications    = [];
  let changeQueue      = [];
  let changeActive     = false;
  const shownChangeKey = `notif_change_shown_${USER_ID}`;
  let shownChangeIds   = new Set();

  try {
    const saved = localStorage.getItem(shownChangeKey);
    if (saved) shownChangeIds = new Set(JSON.parse(saved));
  } catch (_) {}

  // ── DOM refs ──────────────────────────────────────────────────────────────
  function $id(id) { return document.getElementById(id); }

  // ── Fetch ─────────────────────────────────────────────────────────────────
  async function loadNotifications() {
    try {
      const res = await fetch(`/notifications/?user_id=${USER_ID}&per_page=50`);
      if (!res.ok) return;
      const data = await res.json();
      // Sort newest first in case the API doesn't guarantee order
      const fetched = (data.notifications || []).sort(
        (a, b) => new Date(b.created_at) - new Date(a.created_at)
      );
      // Merge: preserve any local is_read=true states set before server syncs
      const localReadIds = new Set(notifications.filter(n => n.is_read).map(n => n.id));
      notifications = fetched.map(n => ({
        ...n,
        is_read: n.is_read || localReadIds.has(n.id),
      }));
      updateBadge();
      renderDropdown();
      processChangePopups();
    } catch (_) {}
  }

  // ── Badge ─────────────────────────────────────────────────────────────────
  function updateBadge() {
    const badge = $id('notificationBadge');
    const icon  = $id('notificationBellIcon');
    if (!badge || !icon) return;

    const unread = notifications.filter(n => !n.is_read).length;
    if (unread > 0) {
      badge.textContent = unread > 99 ? '99+' : unread;
      badge.classList.add('show');
      icon.classList.add('has-unread');
    } else {
      badge.classList.remove('show');
      icon.classList.remove('has-unread');
    }
  }

  // ── Dropdown render ───────────────────────────────────────────────────────
  function renderDropdown() {
    const list = $id('notificationList');
    if (!list) return;

    if (!notifications.length) {
      list.innerHTML = `<div class="notif-empty"><span class="material-symbols-outlined">notifications_off</span>No notifications</div>`;
      return;
    }

    list.innerHTML = notifications.map(n => {
      const meta   = TYPE_META[n.notification_type] || TYPE_META.info;
      const unread = !n.is_read;
      return `
        <div class="notif-item ${unread ? 'unread' : ''} ${meta.clickable ? 'notif-clickable' : ''}"
             data-id="${n.id}" data-clickable="${meta.clickable}">
          <span class="notif-item-icon ${meta.cssClass}">${meta.icon}</span>
          <div class="notif-item-body">
            <div class="notif-item-title">${esc(n.title)}</div>
            <div class="notif-item-message">${esc(n.message)}</div>
            <div class="notif-item-footer">
              <span class="notif-item-time">${timeAgo(n.created_at)}</span>
              ${meta.clickable ? '<span class="notif-item-cta">View details →</span>' : ''}
            </div>
          </div>
          ${unread ? '<div class="notif-item-dot"></div>' : ''}
        </div>`;
    }).join('');

    list.querySelectorAll('.notif-item').forEach(el => {
      const id        = parseInt(el.dataset.id, 10);
      const clickable = el.dataset.clickable === 'true';
      el.addEventListener('click', e => {
        e.stopPropagation();
        markAsRead(id);
        if (clickable) {
          const n = notifications.find(x => x.id === id);
          if (n) openModal(n);
        }
      });
    });
  }

  // ── Position dropdown relative to bell button ─────────────────────────────
  function positionDropdown() {
    const dd  = $id('notificationDropdown');
    const btn = $id('notificationBellBtn');
    if (!dd || !btn) return;

    const rect      = btn.getBoundingClientRect();
    const ddWidth   = 340;
    const gap       = 8;
    const top       = rect.bottom + gap;
    const viewRight = window.innerWidth - 8;
    const left      = Math.min(rect.right - ddWidth, viewRight - ddWidth);
    const maxHeight = window.innerHeight - top - 12;

    dd.style.top       = top + 'px';
    dd.style.left      = Math.max(8, left) + 'px';
    dd.style.maxHeight = Math.min(480, maxHeight) + 'px';
  }

  // ── Toggle dropdown ───────────────────────────────────────────────────────
  function toggleDropdown() {
    const dd = $id('notificationDropdown');
    if (!dd) return;
    const isOpen = dd.classList.contains('open');
    if (isOpen) {
      dd.classList.remove('open');
    } else {
      positionDropdown();
      dd.classList.add('open');
      loadNotifications(); // refresh on open
    }
  }

  function closeDropdown() {
    const dd = $id('notificationDropdown');
    if (dd) dd.classList.remove('open');
  }

  // ── Modal ─────────────────────────────────────────────────────────────────
  let _activeModalNotif = null;

  function openModal(n) {
    const meta        = TYPE_META[n.notification_type] || TYPE_META.info;
    const downloadBtn = $id('notifModalDownloadBtn');
    _activeModalNotif = n;

    $id('notifModalIcon').textContent  = meta.icon;
    $id('notifModalTitle').textContent = n.title;
    $id('notifModalBody').textContent  = n.detail || n.message;
    $id('notifModalOverlay').classList.add('open');

    // Show download button only for change-type notifications
    if (downloadBtn) {
      downloadBtn.style.display = n.notification_type === 'change' ? 'flex' : 'none';
    }

    closeDropdown();
  }

  function closeModal() {
    const overlay = $id('notifModalOverlay');
    if (overlay) overlay.classList.remove('open');
    _activeModalNotif = null;
  }

  function downloadReport() {
    if (!_activeModalNotif) return;
    const content  = _activeModalNotif.detail || _activeModalNotif.message || '';
    const title    = _activeModalNotif.title || 'farm-change-report';
    const date     = new Date().toISOString().slice(0, 10);
    const filename = `${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${date}.txt`;

    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Change popups ─────────────────────────────────────────────────────────
  function processChangePopups() {
    const changes = notifications.filter(n => n.notification_type === 'change' && !n.is_read);
    const currentIds = new Set(changes.map(n => n.id));

    for (const id of shownChangeIds) {
      if (!currentIds.has(id)) shownChangeIds.delete(id);
    }
    try { localStorage.setItem(shownChangeKey, JSON.stringify([...shownChangeIds])); } catch (_) {}

    changes.forEach(n => {
      if (!shownChangeIds.has(n.id)) {
        changeQueue.push(n);
        shownChangeIds.add(n.id);
        try { localStorage.setItem(shownChangeKey, JSON.stringify([...shownChangeIds])); } catch (_) {}
      }
    });

    showNextChangePopup();
  }

  function showNextChangePopup() {
    if (changeActive || !changeQueue.length) return;
    changeActive = true;

    const n         = changeQueue.shift();
    const container = $id('changeAlertsContainer');
    if (!container) { changeActive = false; return; }

    const el = document.createElement('div');
    el.className = 'notif-change-popup';
    el.innerHTML = `
      <div class="notif-change-header">
        <div class="notif-change-title">🔄 ${esc(n.title)}</div>
        <button class="notif-change-close-btn" aria-label="Dismiss">&times;</button>
      </div>
      <div class="notif-change-message">${esc(n.message)}</div>`;
    container.appendChild(el);

    const dismiss = () => {
      el.remove();
      changeActive = false;
      setTimeout(showNextChangePopup, 120);
    };

    el.querySelector('.notif-change-close-btn').addEventListener('click', () => {
      markAsRead(n.id);
      dismiss();
    });
    setTimeout(dismiss, 10000);
  }

  // ── Mark read ─────────────────────────────────────────────────────────────
  async function markAsRead(id) {
    const n = notifications.find(x => x.id === id);
    if (!n || n.is_read) return; // already read, skip server call
    n.is_read = true;
    updateBadge();
    // Update just this item's styling without full re-render
    const el = document.querySelector(`.notif-item[data-id="${id}"]`);
    if (el) {
      el.classList.remove('unread');
      el.querySelector('.notif-item-dot')?.remove();
    }
    try { await fetch(`/notifications/${id}/read`, { method: 'PUT' }); } catch (_) {}
  }

  async function markAllRead() {
    notifications.forEach(n => n.is_read = true);
    changeQueue = [];
    shownChangeIds.clear();
    try { localStorage.setItem(shownChangeKey, JSON.stringify([])); } catch (_) {}
    updateBadge();
    // Update all items' styling without full re-render
    document.querySelectorAll('.notif-item.unread').forEach(el => {
      el.classList.remove('unread');
      el.querySelector('.notif-item-dot')?.remove();
    });
    try { await fetch(`/notifications/read-all?user_id=${USER_ID}`, { method: 'PUT' }); } catch (_) {}
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'just now';
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    return `${Math.floor(h / 24)}d ago`;
  }

  function esc(t) {
    const d = document.createElement('div');
    d.textContent = t ?? '';
    return d.innerHTML;
  }

  // ── Wire up after DOM ready ───────────────────────────────────────────────
  function init() {
    const bellBtn          = $id('notificationBellBtn');
    const markAllBtn       = $id('markAllReadBtn');
    const modalOverlay     = $id('notifModalOverlay');
    const modalCloseBtn    = $id('notifModalCloseBtn');
    const modalDoneBtn     = $id('notifModalDoneBtn');
    const modalDownloadBtn = $id('notifModalDownloadBtn');

    if (bellBtn)          bellBtn.addEventListener('click', e => { e.stopPropagation(); toggleDropdown(); });
    if (markAllBtn)       markAllBtn.addEventListener('click', e => { e.stopPropagation(); markAllRead(); });
    if (modalCloseBtn)    modalCloseBtn.addEventListener('click', closeModal);
    if (modalDoneBtn)     modalDoneBtn.addEventListener('click', closeModal);
    if (modalDownloadBtn) modalDownloadBtn.addEventListener('click', downloadReport);
    if (modalOverlay)     modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

    document.addEventListener('click', e => {
      const container = $id('notification-container');
      if (container && !container.contains(e.target)) closeDropdown();
    });

    loadNotifications();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
