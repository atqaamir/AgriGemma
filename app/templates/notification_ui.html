<!-- Notification System UI Component -->
<style>
  /* ── Container & Bell ─────────────────────────────────────────────────── */
  #notification-container {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  #notificationBellBtn {
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    transition: background-color 0.15s;
  }

  #notificationBellBtn:hover {
    background-color: #f1eee5;
  }

  .dark #notificationBellBtn:hover {
    background-color: #2a2a24;
  }

  #notificationBellBtn:active {
    transform: scale(0.95);
  }

  .notification-bell-icon {
    color: #47573b;
    font-size: 24px;
    transition: color 0.2s;
  }

  .dark .notification-bell-icon {
    color: #d5e9c1;
  }

  .notification-bell-icon.has-unread {
    color: #ba1a1a;
  }

  .dark .notification-bell-icon.has-unread {
    color: #ff8a80;
  }

  /* ── Badge ────────────────────────────────────────────────────────────── */
  .notification-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    background-color: #ba1a1a;
    color: #fff;
    border-radius: 50%;
    min-width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    font-family: 'Manrope', sans-serif;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    border: 2px solid #fcf9f0;
  }

  .dark .notification-badge {
    border-color: #1c1c17;
  }

  .notification-badge.show {
    opacity: 1;
  }

  /* Tiny grey dot when all notifications are read but some exist */
  .notification-badge.show-read {
    opacity: 1;
    background-color: #9e9e8e;
    min-width: 8px;
    height: 8px;
    top: 6px;
    right: 6px;
    border-width: 1px;
  }

  /* ── Dropdown ─────────────────────────────────────────────────────────── */
  .notification-dropdown {
    position: fixed;
    background: #fcf9f0;
    border: 1px solid #c5c8bd;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(28, 28, 23, 0.12);
    z-index: 9999;
    width: 340px;
    max-width: calc(100vw - 16px);
    max-height: 480px;
    display: none;
    overflow: hidden;
  }

  .dark .notification-dropdown {
    background: #222219;
    border-color: #3a3a30;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  .notification-dropdown.open {
    display: flex;
    flex-direction: column;
    animation: notifSlideDown 0.2s cubic-bezier(0.22, 0.68, 0, 1.2) both;
  }

  @keyframes notifSlideDown {
    from { opacity: 0; transform: translateY(-8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Dropdown Header ──────────────────────────────────────────────────── */
  .notif-dropdown-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid #e8e5dc;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .dark .notif-dropdown-header {
    border-bottom-color: #3a3a30;
  }

  .notif-dropdown-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #1c1c17;
  }

  .dark .notif-dropdown-title {
    color: #e5e2da;
  }

  .notif-mark-all-btn {
    background: none;
    border: none;
    color: #47573b;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background-color 0.15s;
    font-family: 'Work Sans', sans-serif;
  }

  .notif-mark-all-btn:hover {
    background-color: #d6e8c5;
  }

  .dark .notif-mark-all-btn {
    color: #d5e9c1;
  }

  .dark .notif-mark-all-btn:hover {
    background-color: #3a4a2e;
  }

  /* ── Dropdown Body ────────────────────────────────────────────────────── */
  .notif-dropdown-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .notif-dropdown-body::-webkit-scrollbar {
    width: 4px;
  }

  .notif-dropdown-body::-webkit-scrollbar-thumb {
    background: #c5c8bd;
    border-radius: 2px;
  }

  .dark .notif-dropdown-body::-webkit-scrollbar-thumb {
    background: #3a3a30;
  }

  /* ── Notification Items ───────────────────────────────────────────────── */
  .notif-item {
    padding: 11px 16px;
    border-bottom: 1px solid #f1eee5;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    transition: background-color 0.15s;
    cursor: default;
  }

  .dark .notif-item {
    border-bottom-color: #2e2e26;
  }

  .notif-item:last-child {
    border-bottom: none;
  }

  .notif-item.notif-clickable {
    cursor: pointer;
  }

  .notif-item:hover {
    background-color: #f7f3ea;
  }

  .dark .notif-item:hover {
    background-color: #2a2a24;
  }

  .notif-item.unread {
    background-color: #f7f3ea;
    border-left: 3px solid #47573b;
    padding-left: 13px;
  }

  .dark .notif-item.unread {
    background-color: #272720;
    border-left-color: #d5e9c1;
  }

  .notif-item-icon {
    font-size: 18px;
    flex-shrink: 0;
    margin-top: 1px;
    line-height: 1;
  }

  .notif-item-body {
    flex: 1;
    min-width: 0;
  }

  .notif-item-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 400;
    font-size: 13px;
    color: #444840;
    margin-bottom: 2px;
    line-height: 1.3;
  }

  .dark .notif-item-title {
    color: #9e9e8e;
  }

  .notif-item.unread .notif-item-title {
    font-weight: 700;
    color: #1c1c17;
  }

  .dark .notif-item.unread .notif-item-title {
    color: #e5e2da;
  }

  .notif-item-message {
    font-size: 12px;
    color: #5a5e54;
    line-height: 1.45;
  }

  .dark .notif-item-message {
    color: #9e9e8e;
  }

  .notif-item-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .notif-item-time {
    font-size: 11px;
    color: #9e9e8e;
  }

  .notif-item-cta {
    font-size: 11px;
    font-weight: 600;
    color: #47573b;
    opacity: 0.85;
  }

  .dark .notif-item-cta {
    color: #d5e9c1;
  }

  .notif-item-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background-color: #47573b;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .dark .notif-item-dot {
    background-color: #d5e9c1;
  }

  /* ── Empty State ──────────────────────────────────────────────────────── */
  .notif-empty {
    padding: 36px 16px;
    text-align: center;
    color: #9e9e8e;
    font-size: 13px;
    font-family: 'Work Sans', sans-serif;
  }

  .notif-empty .material-symbols-outlined {
    font-size: 32px;
    display: block;
    margin-bottom: 8px;
    opacity: 0.5;
  }

  /* ── Dropdown Footer ──────────────────────────────────────────────────── */
  .notif-dropdown-footer {
    padding: 12px 16px;
    border-top: 1px solid #e8e5dc;
    text-align: center;
    flex-shrink: 0;
  }

  .dark .notif-dropdown-footer {
    border-top-color: #3a3a30;
  }

  .notif-view-all-link {
    color: #47573b;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Work Sans', sans-serif;
    padding: 6px 16px;
    border-radius: 8px;
    display: inline-block;
    transition: background-color 0.15s;
  }

  .notif-view-all-link:hover {
    background-color: #d6e8c5;
  }

  .dark .notif-view-all-link {
    color: #d5e9c1;
  }

  .dark .notif-view-all-link:hover {
    background-color: #3a4a2e;
  }

  /* ── Detail Modal ─────────────────────────────────────────────────────── */
  .notif-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background-color: rgba(28, 28, 23, 0.5);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .notif-modal-overlay.open {
    display: flex;
    animation: notifFadeIn 0.2s ease both;
  }

  @keyframes notifFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .notif-modal {
    background: #fcf9f0;
    border-radius: 20px;
    width: 100%;
    max-width: 540px;
    box-shadow: 0 20px 60px rgba(28, 28, 23, 0.2);
    overflow: hidden;
    animation: notifSlideUp 0.25s cubic-bezier(0.22, 0.68, 0, 1.2) both;
  }

  .dark .notif-modal {
    background: #222219;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  @keyframes notifSlideUp {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  .notif-modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 20px 20px 16px;
    border-bottom: 1px solid #e8e5dc;
  }

  .dark .notif-modal-header {
    border-bottom-color: #3a3a30;
  }

  .notif-modal-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .notif-modal-icon {
    font-size: 22px;
    flex-shrink: 0;
  }

  .notif-modal-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: #1c1c17;
    line-height: 1.3;
  }

  .dark .notif-modal-title {
    color: #e5e2da;
  }

  .notif-modal-close-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #9e9e8e;
    padding: 4px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color 0.15s, color 0.15s;
  }

  .notif-modal-close-btn:hover {
    background-color: #f1eee5;
    color: #1c1c17;
  }

  .dark .notif-modal-close-btn:hover {
    background-color: #2a2a24;
    color: #e5e2da;
  }

  .notif-modal-body {
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.65;
    color: #444840;
    max-height: 420px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .dark .notif-modal-body {
    color: #9e9e8e;
  }

  .notif-modal-footer {
    padding: 14px 20px;
    border-top: 1px solid #e8e5dc;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dark .notif-modal-footer {
    border-top-color: #3a3a30;
  }

  .notif-modal-done-btn {
    padding: 9px 24px;
    background-color: #47573b;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.15s, transform 0.1s;
  }

  .notif-modal-done-btn:hover {
    background-color: #3a4a2e;
  }

  .notif-modal-done-btn:active {
    transform: scale(0.96);
  }

  .notif-modal-download-btn {
    padding: 9px 18px;
    background: none;
    color: #47573b;
    border: 1.5px solid #47573b;
    border-radius: 10px;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background-color 0.15s, transform 0.1s;
  }

  .notif-modal-download-btn:hover {
    background-color: #d6e8c5;
  }

  .notif-modal-download-btn:active {
    transform: scale(0.96);
  }

  .dark .notif-modal-download-btn {
    color: #d5e9c1;
    border-color: #d5e9c1;
  }

  .dark .notif-modal-download-btn:hover {
    background-color: #3a4a2e;
  }

  /* ── Change Popup ─────────────────────────────────────────────────────── */
  .notif-change-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1a0a0a;
    border: 2px solid #ff3b3b;
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 0 0 4px rgba(255, 59, 59, 0.2), 0 16px 48px rgba(0, 0, 0, 0.6);
    z-index: 3000;
    width: calc(100% - 32px);
    max-width: 440px;
    animation: changeAlarmIn 0.25s cubic-bezier(0.22, 0.68, 0, 1.2) both,
               changeAlarmPulse 2s ease-in-out 0.25s infinite;
  }

  @keyframes changeAlarmIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  @keyframes changeAlarmPulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(255, 59, 59, 0.2), 0 16px 48px rgba(0,0,0,0.6); }
    50%       { box-shadow: 0 0 0 8px rgba(255, 59, 59, 0.35), 0 16px 48px rgba(0,0,0,0.6); }
  }

  .notif-change-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ff3b3b;
    color: #fff;
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .notif-change-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
    gap: 8px;
  }

  .notif-change-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: #ffffff;
    line-height: 1.3;
  }

  .notif-change-close-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
    line-height: 1;
  }

  .notif-change-close-btn:hover { background: rgba(255,255,255,0.2); }

  .notif-change-message {
    font-size: 13px;
    color: #ffcdd2;
    line-height: 1.6;
  }

  /* ── Report card ─────────────────────────────────────────────────────── */
  .rpt-report { display: flex; flex-direction: column; gap: 8px; }

  .rpt-intro {
    font-size: 13px;
    color: #5a5e54;
    line-height: 1.6;
    margin: 0;
  }
  .dark .rpt-intro { color: #9e9e8e; }

  .rpt-section {
    background: #f7f3ea;
    border-radius: 10px;
    padding: 8px 12px;
  }
  .dark .rpt-section { background: #2a2a24; }

  .rpt-section-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #47573b;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dark .rpt-section-title { color: #d5e9c1; }

  .rpt-count {
    background: #47573b;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 20px;
    text-transform: none;
    letter-spacing: 0;
  }
  .dark .rpt-count { background: #d5e9c1; color: #1c1c17; }

  .rpt-weather-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .rpt-weather-temp {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: #1c1c17;
  }
  .dark .rpt-weather-temp { color: #e5e2da; }

  .rpt-weather-cond {
    font-size: 14px;
    font-weight: 600;
    color: #444840;
  }
  .dark .rpt-weather-cond { color: #9e9e8e; }

  .rpt-weather-rain {
    font-size: 12px;
    color: #5a5e54;
  }
  .dark .rpt-weather-rain { color: #9e9e8e; }

  .rpt-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    font-family: 'Manrope', sans-serif;
  }
  .rpt-badge-red  { background: #ffebee; color: #ba1a1a; }
  .rpt-badge-blue { background: #e3f2fd; color: #1565c0; }
  .dark .rpt-badge-red  { background: #4a1010; color: #ff8a80; }
  .dark .rpt-badge-blue { background: #0d2a4a; color: #90caf9; }

  .rpt-task-item {
    padding: 5px 0;
    border-bottom: 1px solid #e8e5dc;
  }
  .dark .rpt-task-item { border-bottom-color: #3a3a30; }
  .rpt-task-item:last-child { border-bottom: none; padding-bottom: 0; }

  .rpt-task-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #1c1c17;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .dark .rpt-task-title { color: #e5e2da; }

  .rpt-field {
    font-size: 11px;
    font-weight: 600;
    background: #e8f0e0;
    color: #47573b;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .dark .rpt-field { background: #2a3a22; color: #d5e9c1; }

  .rpt-task-changes {
    margin: 0;
    padding-left: 16px;
    list-style: disc;
  }
  .rpt-task-changes li {
    font-size: 12px;
    color: #5a5e54;
    line-height: 1.6;
  }
  .dark .rpt-task-changes li { color: #9e9e8e; }

  .rpt-plan-item {
    padding: 5px 0;
    border-bottom: 1px solid #e8e5dc;
  }
  .dark .rpt-plan-item { border-bottom-color: #3a3a30; }
  .rpt-plan-item:last-child { border-bottom: none; padding-bottom: 0; }

  .rpt-plan-factor {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: #fff3e0;
    color: #b45309;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 4px;
  }
  .dark .rpt-plan-factor { background: #3a2a10; color: #fbbf24; }

  .rpt-plan-reason {
    font-size: 12px;
    color: #444840;
    line-height: 1.5;
  }
  .dark .rpt-plan-reason { color: #9e9e8e; }

  .rpt-plan-adj {
    font-size: 12px;
    font-weight: 600;
    color: #47573b;
    margin-top: 2px;
  }
  .dark .rpt-plan-adj { color: #d5e9c1; }

  .rpt-ai-section { border: 1px solid #d6e8c5; }
  .dark .rpt-ai-section { border-color: #3a4a2e; }

  .rpt-ai-text {
    font-size: 13px;
    color: #444840;
    line-height: 1.65;
    margin: 0;
  }
  .dark .rpt-ai-text { color: #9e9e8e; }

  .rpt-empty {
    font-size: 12px;
    color: #9e9e8e;
    margin: 0;
  }

  /* ── Type colours ─────────────────────────────────────────────────────── */
  .notif-type-critical    { color: #ba1a1a; }
  .notif-type-alert       { color: #ba1a1a; }
  .notif-type-warning     { color: #b45309; }
  .notif-type-info        { color: #1d4ed8; }
  .notif-type-recommendation { color: #166534; }
  .notif-type-change      { color: #7C3AED; }

  .dark .notif-type-change { color: #c4b5fd; }

  .dark .notif-type-critical    { color: #ff8a80; }
  .dark .notif-type-alert       { color: #ff8a80; }
  .dark .notif-type-warning     { color: #fbbf24; }
  .dark .notif-type-info        { color: #93c5fd; }
  .dark .notif-type-recommendation { color: #86efac; }
</style>

<!-- ── Bell Button ──────────────────────────────────────────────────────────── -->
<div id="notification-container" style="position: relative; display: inline-flex;">
  <button id="notificationBellBtn" aria-label="Notifications" title="Notifications">
    <span class="material-symbols-outlined notification-bell-icon" id="notificationBellIcon">notifications</span>
    <span class="notification-badge" id="notificationBadge"></span>
  </button>

  <!-- ── Dropdown ──────────────────────────────────────────────────────── -->
  <div class="notification-dropdown" id="notificationDropdown">
    <div class="notif-dropdown-header">
      <span class="notif-dropdown-title">Notifications</span>
      <button class="notif-mark-all-btn" id="markAllReadBtn">Mark all read</button>
    </div>
    <div class="notif-dropdown-body" id="notificationList">
      <div class="notif-empty">
        <span class="material-symbols-outlined">notifications_off</span>
        No notifications
      </div>
    </div>
    <div class="notif-dropdown-footer">
      <a href="/notifications/page" class="notif-view-all-link">View all notifications →</a>
    </div>
  </div>
</div>

<!-- ── Change Popup Container ────────────────────────────────────────────────── -->
<div id="changeAlertsContainer"></div>

<!-- ── Detail Modal ─────────────────────────────────────────────────────────── -->
<div class="notif-modal-overlay" id="notifModalOverlay">
  <div class="notif-modal">
    <div class="notif-modal-header">
      <div class="notif-modal-header-left">
        <span class="notif-modal-icon" id="notifModalIcon"></span>
        <h2 class="notif-modal-title" id="notifModalTitle"></h2>
      </div>
      <button class="notif-modal-close-btn" id="notifModalCloseBtn" aria-label="Close">
        <span class="material-symbols-outlined" style="font-size:20px;">close</span>
      </button>
    </div>
    <div class="notif-modal-body" id="notifModalBody"></div>
    <div class="notif-modal-footer">
      <button class="notif-modal-download-btn" id="notifModalDownloadBtn" style="display:none;">
        <span class="material-symbols-outlined" style="font-size:18px;">download</span>
        Download Report
      </button>
      <button class="notif-modal-done-btn" id="notifModalDoneBtn">Done</button>
    </div>
  </div>
</div>

<script>
(function () {
  if (window.__notifSystemLoaded) return;
  window.__notifSystemLoaded = true;

  const USER_ID = {{ current_user_id }};

  const TYPE_META = {
    info:           { icon: 'ℹ️',  cssClass: 'notif-type-info',           clickable: false },
    warning:        { icon: '⚠️',  cssClass: 'notif-type-warning',        clickable: true  },
    alert:          { icon: '🔴',  cssClass: 'notif-type-alert',          clickable: true  },
    critical:       { icon: '🚨',  cssClass: 'notif-type-critical',       clickable: true  },
    recommendation: { icon: '💡',  cssClass: 'notif-type-recommendation', clickable: true  },
    change:         { icon: '🔄',  cssClass: 'notif-type-change',         clickable: true  },
  };

  let notifications   = [];
  let changeQueue     = [];
  let changeActive    = false;
  let shownChangeIds  = new Set(); // prevents re-queuing after shift() removes from queue

  // ── DOM refs ──────────────────────────────────────────────────────────────
  function $id(id) { return document.getElementById(id); }

  // ── Fetch ─────────────────────────────────────────────────────────────────
  async function loadNotifications() {
    try {
      const res = await fetch(`/notifications/?user_id=${USER_ID}&per_page=50`);
      if (!res.ok) {
        console.error(`[notifications] API error ${res.status}:`, await res.text().catch(() => ''));
        return;
      }
      const data = await res.json();
      const fetched = (data.notifications || []).sort(
        (a, b) => new Date(b.created_at) - new Date(a.created_at)
      );
      const localReadIds = new Set(notifications.filter(n => n.is_read).map(n => n.id));
      notifications = fetched.map(n => ({
        ...n,
        is_read: n.is_read || localReadIds.has(n.id),
      }));
      updateBadge();
      renderDropdown();
      processChangePopups();
    } catch (err) {
      console.error('[notifications] fetch failed:', err);
    }
  }

  // ── Badge ─────────────────────────────────────────────────────────────────
  function updateBadge() {
    const badge = $id('notificationBadge');
    const icon  = $id('notificationBellIcon');
    if (!badge || !icon) return;

    const unread = notifications.filter(n => !n.is_read).length;
    const total  = notifications.length;
    if (unread > 0) {
      badge.textContent = unread > 99 ? '99+' : unread;
      badge.classList.add('show');
      badge.classList.remove('show-read');
      icon.classList.add('has-unread');
    } else if (total > 0) {
      // All read but notifications exist — show a subtle dot so the bell isn't bare
      badge.textContent = '';
      badge.classList.remove('show');
      badge.classList.add('show-read');
      icon.classList.remove('has-unread');
    } else {
      badge.classList.remove('show', 'show-read');
      icon.classList.remove('has-unread');
    }
  }

  // ── Dropdown render ───────────────────────────────────────────────────────
  function renderDropdown() {
    const list = $id('notificationList');
    if (!list) return;

    if (!notifications.length) {
      list.innerHTML = `<div class="notif-empty"><span class="material-symbols-outlined">notifications_off</span>No notifications</div>`;
      return;
    }

    list.innerHTML = notifications.map(n => {
      const meta   = TYPE_META[n.notification_type] || TYPE_META.info;
      const unread = !n.is_read;
      return `
        <div class="notif-item ${unread ? 'unread' : ''} ${meta.clickable ? 'notif-clickable' : ''}"
             data-id="${n.id}" data-clickable="${meta.clickable}">
          <span class="notif-item-icon ${meta.cssClass}">${meta.icon}</span>
          <div class="notif-item-body">
            <div class="notif-item-title">${esc(n.title)}</div>
            ${!meta.clickable ? `<div class="notif-item-message">${esc(n.message)}</div>` : ''}
            <div class="notif-item-footer">
              <span class="notif-item-time">${timeAgo(n.created_at)}</span>
              ${meta.clickable ? '<span class="notif-item-cta">View details →</span>' : ''}
            </div>
          </div>
          ${unread ? '<div class="notif-item-dot"></div>' : ''}
        </div>`;
    }).join('');

    list.querySelectorAll('.notif-item').forEach(el => {
      const id        = parseInt(el.dataset.id, 10);
      const clickable = el.dataset.clickable === 'true';
      el.addEventListener('click', e => {
        e.stopPropagation();
        if (clickable) {
          // Mark as read only when the user explicitly closes the modal (Done/X)
          const n = notifications.find(x => x.id === id);
          if (n) openModal(n);
        } else {
          // Non-clickable (info): mark as read on click since there's no modal to close
          markAsRead(id);
        }
      });
    });
  }

  // ── Position dropdown relative to bell button ─────────────────────────────
  function positionDropdown() {
    const dd  = $id('notificationDropdown');
    const btn = $id('notificationBellBtn');
    if (!dd || !btn) return;

    const rect      = btn.getBoundingClientRect();
    const ddWidth   = 340;
    const gap       = 8;
    const top       = rect.bottom + gap;
    const viewRight = window.innerWidth - 8;
    const left      = Math.min(rect.right - ddWidth, viewRight - ddWidth);
    const maxHeight = window.innerHeight - top - 12;

    dd.style.top       = top + 'px';
    dd.style.left      = Math.max(8, left) + 'px';
    dd.style.maxHeight = Math.min(480, maxHeight) + 'px';
  }

  // ── Toggle dropdown ───────────────────────────────────────────────────────
  function toggleDropdown() {
    const dd = $id('notificationDropdown');
    if (!dd) return;
    const isOpen = dd.classList.contains('open');
    if (isOpen) {
      dd.classList.remove('open');
    } else {
      positionDropdown();
      dd.classList.add('open');
      loadNotifications(); // refresh on open
    }
  }

  function closeDropdown() {
    const dd = $id('notificationDropdown');
    if (dd) dd.classList.remove('open');
  }

  // ── Modal ─────────────────────────────────────────────────────────────────
  let _activeModalNotif = null;

  function openModal(n) {
    const meta        = TYPE_META[n.notification_type] || TYPE_META.info;
    const downloadBtn = $id('notifModalDownloadBtn');
    const body        = $id('notifModalBody');
    _activeModalNotif = n;

    $id('notifModalIcon').textContent  = meta.icon;
    $id('notifModalTitle').textContent = n.title;

    // Only change notifications get the full structured report card
    let hasReport = false;
    if (n.notification_type === 'change' && n.detail) {
      try {
        const report = JSON.parse(n.detail);
        if (report && typeof report === 'object' && report.weather !== undefined) {
          body.innerHTML = renderReport(report, n.message);
          hasReport = true;
        } else {
          body.textContent = n.detail || n.message;
        }
      } catch (_) {
        body.textContent = n.detail || n.message;
      }
    } else {
      // All other types: show only the ai_summary if available, otherwise message
      let summary = n.message;
      if (n.detail) {
        try {
          const report = JSON.parse(n.detail);
          if (report && report.ai_summary) summary = report.ai_summary;
        } catch (_) {
          summary = n.detail;
        }
      }
      body.textContent = summary;
    }

    $id('notifModalOverlay').classList.add('open');
    if (downloadBtn) {
      downloadBtn.style.display = hasReport ? 'flex' : 'none';
    }
    closeDropdown();
  }

  function renderReport(r, introMessage) {
    const w   = r.weather || {};
    const esc2 = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // ── Weather card ────────────────────────────────────────────────────
    const tempStr = w.temp != null ? `${Math.round(w.temp)}°C` : '—';
    const badges  = [];
    if (w.heatwave)     badges.push('<span class="rpt-badge rpt-badge-red">Heatwave Risk</span>');
    if (w.rain_expected) badges.push('<span class="rpt-badge rpt-badge-blue">Rain Expected</span>');
    const weatherHtml = `
      <div class="rpt-section">
        <div class="rpt-section-title">🌤 Weather Today</div>
        <div class="rpt-weather-row">
          <span class="rpt-weather-temp">${esc2(tempStr)}</span>
          <span class="rpt-weather-cond">${esc2(w.condition || '—')}</span>
          <span class="rpt-weather-rain">${w.rainfall_mm ? Math.round(w.rainfall_mm) + 'mm rainfall' : 'No rainfall'}</span>
          ${badges.join('')}
        </div>
      </div>`;

    // ── Tasks section ───────────────────────────────────────────────────
    let tasksHtml = '';
    const tasks = r.tasks || [];
    if (tasks.length) {
      const rows = tasks.map(t => {
        const field = t.field ? `<span class="rpt-field">${esc2(t.field)}</span>` : '';
        const changes = (t.changes || []).map(ch => `<li>${esc2(ch)}</li>`).join('');
        return `<div class="rpt-task-item">
          <div class="rpt-task-title">${esc2(t.title)}${field}</div>
          <ul class="rpt-task-changes">${changes}</ul>
        </div>`;
      }).join('');
      tasksHtml = `
        <div class="rpt-section">
          <div class="rpt-section-title">📋 Tasks Changed <span class="rpt-count">${tasks.length}</span></div>
          ${rows}
        </div>`;
    } else {
      tasksHtml = `<div class="rpt-section"><div class="rpt-section-title">📋 Tasks</div><p class="rpt-empty">No task changes recorded.</p></div>`;
    }

    // ── Weekly plan section ─────────────────────────────────────────────
    let planHtml = '';
    const plan = r.plan || [];
    if (plan.length) {
      const rows = plan.map(adj => `
        <div class="rpt-plan-item">
          <span class="rpt-plan-factor">${esc2(adj.factor || 'weather')}</span>
          <div class="rpt-plan-reason">${esc2(adj.reasoning || '')}</div>
          ${adj.adjustment ? `<div class="rpt-plan-adj">→ ${esc2(adj.adjustment)}</div>` : ''}
        </div>`).join('');
      planHtml = `
        <div class="rpt-section">
          <div class="rpt-section-title">📅 Weekly Plan Adjustments</div>
          ${rows}
        </div>`;
    } else {
      planHtml = `<div class="rpt-section"><div class="rpt-section-title">📅 Weekly Plan</div><p class="rpt-empty">No weekly plan changes recorded.</p></div>`;
    }

    // ── AI summary ──────────────────────────────────────────────────────
    const summaryHtml = r.ai_summary ? `
      <div class="rpt-section rpt-ai-section">
        <div class="rpt-section-title">🤖 AI Summary</div>
        <p class="rpt-ai-text">${esc2(r.ai_summary)}</p>
      </div>` : '';

    const introHtml = introMessage
      ? `<p class="rpt-intro">${esc2(introMessage)}</p>`
      : '';
    return `<div class="rpt-report">${introHtml}${weatherHtml}${tasksHtml}${planHtml}${summaryHtml}</div>`;
  }

  function closeModal() {
    const overlay = $id('notifModalOverlay');
    if (overlay) overlay.classList.remove('open');
    if (_activeModalNotif) markAsRead(_activeModalNotif.id);
    _activeModalNotif = null;
  }

  function downloadReport() {
    if (!_activeModalNotif) return;
    const n        = _activeModalNotif;
    const dateStr  = new Date().toISOString().slice(0, 10);
    const filename = `farm-change-report-${dateStr}.txt`;
    let content    = '';

    try {
      const r = JSON.parse(n.detail || '{}');
      if (r.weather !== undefined) {
        const w = r.weather || {};
        const lines = [`Farm Change Report — ${r.date || dateStr}`, ''];
        lines.push('WEATHER');
        lines.push(`  ${w.temp != null ? Math.round(w.temp) + '°C' : '—'}  ${w.condition || ''}  ${w.rainfall_mm ? Math.round(w.rainfall_mm) + 'mm rainfall' : 'No rainfall'}`);
        if (w.heatwave) lines.push('  ⚠ Heatwave risk');
        if (w.rain_expected) lines.push('  ⚠ Rain expected');
        lines.push('');
        lines.push(`TASKS CHANGED (${(r.tasks || []).length})`);
        (r.tasks || []).forEach(t => {
          lines.push(`  • ${t.title}${t.field ? ' — ' + t.field : ''}`);
          (t.changes || []).forEach(ch => lines.push(`      - ${ch}`));
        });
        if (!(r.tasks || []).length) lines.push('  No task changes.');
        lines.push('');
        lines.push('WEEKLY PLAN ADJUSTMENTS');
        (r.plan || []).forEach(adj => {
          lines.push(`  [${(adj.factor || 'weather').toUpperCase()}] ${adj.reasoning || ''}`);
          if (adj.adjustment) lines.push(`      → ${adj.adjustment}`);
        });
        if (!(r.plan || []).length) lines.push('  No plan changes.');
        if (r.ai_summary) {
          lines.push('');
          lines.push('AI SUMMARY');
          lines.push(`  ${r.ai_summary}`);
        }
        content = lines.join('\n');
      }
    } catch (_) {}

    if (!content) content = n.detail || n.message || '';

    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  // ── Change popups ─────────────────────────────────────────────────────────
  function processChangePopups() {
    const incoming = notifications.filter(n => n.notification_type === 'change' && !n.is_read && !shownChangeIds.has(n.id));
    incoming.forEach(n => {
      shownChangeIds.add(n.id);
      changeQueue.push(n);
    });
    if (incoming.length > 0) {
      document.dispatchEvent(new CustomEvent('farmDataUpdated'));
    }
    showNextChangePopup();
  }

  function showNextChangePopup() {
    if (changeActive || !changeQueue.length) return;
    changeActive = true;

    const n         = changeQueue.shift();
    const container = $id('changeAlertsContainer');
    if (!container) { changeActive = false; return; }

    const el = document.createElement('div');
    el.className = 'notif-change-popup';
    el.innerHTML = `
      <div class="notif-change-badge">🚨 Alert — Action Required</div>
      <div class="notif-change-header">
        <div class="notif-change-title">${esc(n.title)}</div>
        <button class="notif-change-close-btn" aria-label="Dismiss">&times;</button>
      </div>
      <div class="notif-change-message">${esc(n.message)}</div>`;
    container.appendChild(el);

    const dismiss = () => {
      el.remove();
      changeActive = false;
      setTimeout(showNextChangePopup, 120);
    };

    el.querySelector('.notif-change-close-btn').addEventListener('click', () => {
      markAsRead(n.id);
      dismiss();
    });
  }

  // ── Mark read ─────────────────────────────────────────────────────────────
  async function markAsRead(id) {
    const n = notifications.find(x => x.id === id);
    if (!n || n.is_read) return; // already read, skip server call
    n.is_read = true;
    updateBadge();
    // Update just this item's styling without full re-render
    const el = document.querySelector(`.notif-item[data-id="${id}"]`);
    if (el) {
      el.classList.remove('unread');
      el.querySelector('.notif-item-dot')?.remove();
    }
    try { await fetch(`/notifications/${id}/read`, { method: 'PUT' }); } catch (_) {}
  }

  async function markAllRead() {
    notifications.forEach(n => n.is_read = true);
    changeQueue = [];
    shownChangeIds.clear();
    updateBadge();
    // Update all items' styling without full re-render
    document.querySelectorAll('.notif-item.unread').forEach(el => {
      el.classList.remove('unread');
      el.querySelector('.notif-item-dot')?.remove();
    });
    try { await fetch(`/notifications/read-all?user_id=${USER_ID}`, { method: 'PUT' }); } catch (_) {}
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'just now';
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    return `${Math.floor(h / 24)}d ago`;
  }

  function esc(t) {
    const d = document.createElement('div');
    d.textContent = t ?? '';
    return d.innerHTML;
  }

  // ── Wire up after DOM ready ───────────────────────────────────────────────
  function init() {
    const bellBtn          = $id('notificationBellBtn');
    const markAllBtn       = $id('markAllReadBtn');
    const modalOverlay     = $id('notifModalOverlay');
    const modalCloseBtn    = $id('notifModalCloseBtn');
    const modalDoneBtn     = $id('notifModalDoneBtn');
    const modalDownloadBtn = $id('notifModalDownloadBtn');

    if (bellBtn)          bellBtn.addEventListener('click', e => { e.stopPropagation(); toggleDropdown(); });
    if (markAllBtn)       markAllBtn.addEventListener('click', e => { e.stopPropagation(); markAllRead(); });
    if (modalCloseBtn)    modalCloseBtn.addEventListener('click', closeModal);
    if (modalDoneBtn)     modalDoneBtn.addEventListener('click', closeModal);
    if (modalDownloadBtn) modalDownloadBtn.addEventListener('click', downloadReport);
    if (modalOverlay)     modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

    document.addEventListener('click', e => {
      const container = $id('notification-container');
      if (container && !container.contains(e.target)) closeDropdown();
    });

    loadNotifications();
    // Poll every 10 seconds so change_summary popups appear promptly after creation
    setInterval(loadNotifications, 10_000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
